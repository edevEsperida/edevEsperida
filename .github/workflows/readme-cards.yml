name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # once a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Uses your README_STATS_TOKEN secret if you add one (counts private repos),
      # otherwise falls back to public-only stats.
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&bg_color=120f2e&title_color=3ee0ff&text_color=e2d9ff&icon_color=ff4fd8&ring_color=ff4fd8&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&size_weight=0.5&count_weight=0.5&bg_color=120f2e&title_color=3ee0ff&text_color=e2d9ff&hide_border=true
          path: profile/top-langs.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pin card — paper-trail
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=paper-trail&bg_color=120f2e&title_color=3ee0ff&text_color=e2d9ff&icon_color=ff4fd8&hide_border=true
          path: profile/pin-paper-trail.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pin card — portfolio
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=portfolio&bg_color=120f2e&title_color=3ee0ff&text_color=e2d9ff&icon_color=ff4fd8&hide_border=true
          path: profile/pin-portfolio.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Pin card — Park-In
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=Park-In&bg_color=120f2e&title_color=3ee0ff&text_color=e2d9ff&icon_color=ff4fd8&hide_border=true
          path: profile/pin-park-in.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
